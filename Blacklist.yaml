mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

http:
  mitm:
    - www.google.cn
  url-rewrite:
    - '^https://www\.google\.cn(/.*)?$ https://www.google.com$1 307'

dns:
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  follow-rule: false
  skip-cert-verify: false
  nameserver-policy:
    "+.apple.com": system
    "+.icloud.com": system
  fake-ip-filter:
    - localhost
    - "+.local"
    - "+.lan"
    - captive.apple.com

hosts:
  localhost: 127.0.0.1

proxy-providers:
  JMS-NODES:
    type: http
    path: ./providers/jms-nodes.yaml
    interval: 28800

proxy-groups:
- name: "Just My Socks"
  type: select
  icon: "https://raw.githubusercontent.com/RiverMud/Stash/refs/heads/master/Proxy.png"
  use:
  - JMS-NODES
  interval: -1

- name: "🇺🇸 美国 s1｜Shadowsocks"
  type: select
  use:
  - JMS-NODES
  filter: 'c15s1'
  interval: -1

- name: "🇺🇸 美国 s2｜VLESS"
  type: select
  use:
  - JMS-NODES
  filter: 'c15s2'
  interval: -1

- name: "🇺🇸 美国 s3｜VLESS"
  type: select
  use:
  - JMS-NODES
  filter: 'c15s3'
  interval: -1

- name: "🇯🇵 日本 s4｜VLESS"
  type: select
  use:
  - JMS-NODES
  filter: 'c15s4'
  interval: -1

- name: "🇳🇱 荷兰 s5｜VLESS"
  type: select
  use:
  - JMS-NODES
  filter: 'c15s5'
  interval: -1

- name: "🇺🇸 美国 s801｜VLESS"
  type: select
  use:
  - JMS-NODES
  filter: 'c15s801'
  interval: -1

rule-providers:
  reject:
    type: http
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/reject.txt"
    path: ./rules/reject.txt
    interval: 86400

  private:
    type: http
    behavior: domain
    format: text
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/surge-rules@release/private.txt"
    path: ./rules/private.txt
    interval: 86400

#  direct:
#    type: http
